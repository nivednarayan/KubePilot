name: Helm CI

on:
  pull_request:
    paths:
      - 'platform/**'

jobs:
  helm-lint:
    name: Helm Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.14.0

      - name: Lint Kyverno Policies
        run: |
          for file in platform/workloads/kyverno-policies/*.yaml; do
            echo "Validating $file"
            kubectl apply --dry-run=client -f "$file" 2>&1 || true
          done

      - name: Validate ArgoCD App manifests
        run: |
          for file in platform/apps/*.yaml; do
            echo "Checking $file"
            python3 -c "
          import yaml, sys
          with open('$file') as f:
              docs = list(yaml.safe_load_all(f))
          print(f'  OK: {len(docs)} document(s)')
          "
          done
